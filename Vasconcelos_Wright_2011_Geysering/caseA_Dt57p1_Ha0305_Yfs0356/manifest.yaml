schema_version: 1
case_id: caseA_Dt57p1_Ha0305_Yfs0356
title: Vasconcelos-Wright 2011 Case A circular 3-D VOF reproduction
case_root: .

source:
  citation: >-
    Vasconcelos, J. G., and Wright, S. J. (2011). Geysering Generated by
    Large Air Pockets Released through Water-Filled Ventilation Shafts.
    Journal of Hydraulic Engineering, 137(5), 543-555.
  doi: 10.1061/(ASCE)HY.1943-7900.0000332
  reference_notes: reference/README.md

contents:
  config: config/case.yaml
  experimental_data:
    - data/fig5_caseA_Hstar_band.csv
    - data/fig7_caseA_levels.csv
  models:
    primary_3d: model/openfoam_3d_caseA
    legacy_planar_2d: model/openfoam_2d_caseA
  scripts: scripts
  reference: reference
  outputs: outputs

runtime:
  software: OpenFOAM
  version: v2512
  solver: compressibleInterFoam
  python_packages:
    - matplotlib
    - numpy
  commands:
    validate_3d: ./scripts/validate_3d.sh
    run_3d: ./scripts/run_3d.sh
    resume_3d: ./scripts/resume_3d.sh
    clean_3d: ./scripts/clean_3d.sh
    postprocess_3d: python3 scripts/postprocess_compare.py --model 3d
    validate_2d: ./scripts/validate.sh
    run_2d: ./scripts/run.sh

validated_planar_run:
  model_commit: a808bef573a4da09a5ded833ed1d2dc9495a1232
  output_commit: d29865b3ec3aaa1b9c7a38be6bf8d12d7c63dc77
  simulation_end_s: 9.0
  mpi_ranks: 4
  mesh_cells: 26128
  metrics: outputs/openfoam_2d_metrics.json
  figures:
    - outputs/openfoam_2d_pressure_comparison.png
    - outputs/openfoam_2d_levels_comparison.png

validated_circular_3d_run:
  model_commit: caf56107454d826535b652ac281d2ed5c1f24370
