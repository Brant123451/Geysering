  - model/openfoam_3d_caseA/log.*
  - model/openfoam_2d_caseA/[time directories]
  - model/openfoam_2d_caseA/processor*
  - model/openfoam_2d_caseA/postProcessing
  - model/openfoam_2d_caseA/log.*
restore_command: ./scripts/run_3d.sh
