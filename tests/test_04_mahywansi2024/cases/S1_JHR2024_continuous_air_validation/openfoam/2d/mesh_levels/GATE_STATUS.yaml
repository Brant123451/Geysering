  eruption_is_hard_gate: true
  stable_no_eruption_result: physics_alignment_failure
  decision_specification: RESULT_ACCEPTANCE.yaml
  solver_end_marker: STAGE2_COMPLETE_UNVALIDATED
  validated_end_marker: RESULT_ACCEPTED
  refined_eruption_required_for_campaign_pass: true
  status: waiting_for_simulation
