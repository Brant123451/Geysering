global_launch_gate:
  formal_run_authorized: false
  last_cpu_check_2026_08_10:
    consecutive_load1_samples:
      - 6.47
    threshold: 9.0
    capacity_sample_gate: passed_at_last_observation
    logical_cpus: 12
    case3_solver_running: false
  current_blocker: >-
    The paper requires total-pressure inlet/outlet semantics, whereas the old
    campaign used static fixedValue p_rgh.  All old preflight, smoke and Stage-1
    outputs are rejected.  A face-centre p0 generator, clean three-level cases,
    fresh preflight and fresh smoke are required before any Stage-1 restart.
  smoke_cpu_rule: >-
    Require load1 below 9 for three consecutive samples; then use one pinned
    logical core, nice 19, and the verified process-group duty-cycle wrapper at
    20 percent. Writable cgroup cpu.max and cpulimit are unavailable here, so
    an environment confirmation alone is not accepted as a quota.
  production_rule: >-
    No production run starts until every level passes the offline and smoke
    gates and safe CPU capacity is available.
  direct_entry_rule: >-
    Each preflight entry point now requires a temporary authorization marker,
    CPU guard/quota flags, one valid cpuset, and three local load1 samples below
    9; failed preflight retains its invalidation marker and consumes temporary
    authorization on every exit. All legacy Allrun entries delegate to these
    preflight launchers.

launch_control_audit:
  static_audit: passed
  evidence: launch_gate_audit.json
  quota_wrapper_self_tests: 4_of_4_passed
  bash_syntax: passed_all_mesh_level_shell_entries
  refined_physics_freeze: invalidated_by_total_pressure_boundary_correction
  openfoam_executed_during_audit: false
  actual_preflight_or_solver_result: old_results_rejected__clean_rerun_pending

result_acceptance_gate:
